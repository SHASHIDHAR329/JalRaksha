[structure]
    type                  = gate                	# Type of structure
    id                    = Kering              	# Name of the structure
    polylinefile          = Kering.pli          	# *.pli; Polyline geometry definition for 2D structure
    CrestLevel            = -10                 	# Gate sill level (in [m])
    GateLowerEdgeLevel    = 100                 	# Gate lower edge level (in [m])
    GateOpeningWidth      = 0                   	# Gate opening width (in [m])
    GateHeight            = 0                   	# Gate door height (in [m])
    GateOpeningHorizontalDirection= symmetric           	# Horizontal direction of the opening doors
    CrestWidth            = 500                 	# Gate sill width (in [m])
